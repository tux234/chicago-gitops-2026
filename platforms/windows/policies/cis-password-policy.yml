# CIS Microsoft Windows 11 Enterprise Benchmark, section 1: Account Policies (all Level 1, so included in Level 2).
# Enforced by ../configuration-profiles/cis-password-policy.xml.
# security_profile_info and cis_audit are fleetd tables that read the effective local security policy (secedit),
# so these pass or fail on what the device actually enforces, however it was set.
# Queries from Fleet's CIS library: https://github.com/fleetdm/fleet/blob/main/ee/cis/win-11/cis-policy-queries.yml
# Note: cis_audit item keys are fleetd's own (1.2.1 = LockoutDuration, 1.2.3 = ResetLockoutCount), not the benchmark's numbering.
- name: Windows - CIS - Enforce password history is 24 or more passwords
  query: SELECT 1 FROM security_profile_info WHERE password_history_size >= 24;
  critical: false
  description: Remembering previous passwords stops users from cycling back to an old, possibly compromised password.
  resolution: |
    Fleet enforces this with the "cis-password-policy" configuration profile (DeviceLock/PasswordHistorySize = 24). Group Policy equivalent: Account Policies > Password Policy > Enforce password history.
  platform: windows
  webhooks_and_tickets_enabled: false
- name: Windows - CIS - Maximum password age is 365 days or fewer, but not 0
  query: SELECT 1 FROM security_profile_info WHERE maximum_password_age > 0 AND maximum_password_age <= 365;
  critical: false
  description: Expiring passwords limits how long a stolen or leaked password stays useful.
  resolution: |
    Fleet enforces this with the "cis-password-policy" configuration profile (DeviceLock/MaximumPasswordAge = 365). Group Policy equivalent: Account Policies > Password Policy > Maximum password age.
  platform: windows
  webhooks_and_tickets_enabled: false
- name: Windows - CIS - Minimum password age is 1 day or more
  query: SELECT 1 FROM security_profile_info WHERE minimum_password_age >= 1;
  critical: false
  description: Without a minimum age, users can change their password 24 times in a row to get back to an old one, defeating password history.
  resolution: |
    Fleet enforces this with the "cis-password-policy" configuration profile (DeviceLock/MinimumPasswordAge = 1). Group Policy equivalent: Account Policies > Password Policy > Minimum password age.
  platform: windows
  webhooks_and_tickets_enabled: false
- name: Windows - CIS - Minimum password length is 14 or more characters
  query: SELECT 1 FROM security_profile_info WHERE minimum_password_length >= 14;
  critical: false
  description: Longer passwords are the single biggest factor in resisting guessing and cracking.
  resolution: |
    Fleet enforces this with the "cis-password-policy" configuration profile (DeviceLock/MinimumPasswordLength = 14). Group Policy equivalent: Account Policies > Password Policy > Minimum password length.
  platform: windows
  webhooks_and_tickets_enabled: false
- name: Windows - CIS - Password must meet complexity requirements
  query: SELECT 1 FROM security_profile_info WHERE password_complexity = 1;
  critical: false
  description: Complexity requires characters from three of four classes (uppercase, lowercase, digits, symbols) and blocks passwords that contain the account name.
  resolution: |
    Fleet enforces this with the "cis-password-policy" configuration profile (DeviceLock/PasswordComplexity = 1). Group Policy equivalent: Account Policies > Password Policy > Password must meet complexity requirements.
  platform: windows
  webhooks_and_tickets_enabled: false
- name: Windows - CIS - Relax minimum password length limits is enabled
  query: SELECT 1 FROM registry WHERE path = 'HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\SAM\RelaxMinimumPasswordLengthLimits' AND data = '1';
  critical: false
  description: Lifts the legacy 14-character ceiling so the minimum length can be raised later without another Group Policy change.
  resolution: |
    Fleet enforces this with the "cis-password-policy" configuration profile (DeviceLock/RelaxMinimumPasswordLengthLimits = 1). Group Policy equivalent: Account Policies > Password Policy > Relax minimum password length limits.
  platform: windows
  webhooks_and_tickets_enabled: false
- name: Windows - CIS - Store passwords using reversible encryption is disabled
  query: SELECT 1 FROM security_profile_info WHERE clear_text_password = 0;
  critical: false
  description: Reversible encryption is effectively plaintext storage of passwords.
  resolution: |
    Fleet enforces this with the "cis-password-policy" configuration profile (DeviceLock/ClearTextPassword = 0). Group Policy equivalent: Account Policies > Password Policy > Store passwords using reversible encryption.
  platform: windows
  webhooks_and_tickets_enabled: false
- name: Windows - CIS - Account lockout duration is 15 minutes or more
  query: SELECT 1 FROM cis_audit WHERE item = '1.2.1' AND CAST(value AS INTEGER) >= 15;
  critical: false
  description: A lockout that lasts at least 15 minutes slows online password guessing to a crawl.
  resolution: |
    Fleet enforces this with the "cis-password-policy" configuration profile (DeviceLock/AccountLockoutPolicy AccountLockoutDuration:15). Group Policy equivalent: Account Policies > Account Lockout Policy > Account lockout duration.
  platform: windows
  webhooks_and_tickets_enabled: false
- name: Windows - CIS - Account lockout threshold is 5 or fewer invalid attempts, but not 0
  query: SELECT 1 FROM security_profile_info WHERE lockout_bad_count > 0 AND lockout_bad_count <= 5;
  critical: false
  description: Locking an account after a small number of failed sign-ins blunts brute-force password guessing. A value of 0 means accounts never lock.
  resolution: |
    Fleet enforces this with the "cis-password-policy" configuration profile (DeviceLock/AccountLockoutPolicy AccountLockoutThreshold:5). Group Policy equivalent: Account Policies > Account Lockout Policy > Account lockout threshold.
  platform: windows
  webhooks_and_tickets_enabled: false
- name: Windows - CIS - Allow Administrator account lockout is enabled
  query: SELECT 1 FROM mdm_bridge WHERE mdm_command_input = '<SyncBody><Get><CmdID>1</CmdID><Item><Target><LocURI>./Device/Vendor/MSFT/Policy/Result/DeviceLock/AllowAdministratorLockout</LocURI></Target></Item></Get></SyncBody>' AND mdm_command_output = '1';
  critical: false
  description: Applies the lockout policy to the built-in Administrator account too, so it can't be brute-forced without limit.
  resolution: |
    Fleet enforces this with the "cis-password-policy" configuration profile (DeviceLock/AllowAdministratorLockout = 1). Group Policy equivalent: Account Policies > Account Lockout Policy > Allow Administrator account lockout.
  platform: windows
  webhooks_and_tickets_enabled: false
- name: Windows - CIS - Reset account lockout counter after 15 minutes or more
  query: SELECT 1 FROM cis_audit WHERE item = '1.2.3' AND CAST(value AS INTEGER) >= 15;
  critical: false
  description: Keeps failed attempts counting toward the lockout threshold for at least 15 minutes.
  resolution: |
    Fleet enforces this with the "cis-password-policy" configuration profile (DeviceLock/AccountLockoutPolicy ResetAccountLockoutCounterAfter:15). Group Policy equivalent: Account Policies > Account Lockout Policy > Reset account lockout counter after.
  platform: windows
  webhooks_and_tickets_enabled: false
