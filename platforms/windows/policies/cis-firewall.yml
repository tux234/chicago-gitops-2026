# CIS Microsoft Windows 11 Enterprise Benchmark, section 9: Windows Defender Firewall with Advanced Security (all Level 1, so included in Level 2).
# Enforced by ../configuration-profiles/cis-firewall.xml.
# Queries from Fleet's CIS library (Windows 11 Intune, which reads values delivered by the same Firewall CSP):
#   https://github.com/fleetdm/fleet/blob/main/docs/solutions/cis/win-11-intune/policies/l1_win11_intune.yml
# mdm_bridge checks need the host enrolled in Fleet's Windows MDM.
- name: Windows - CIS - Domain firewall is on
  query: SELECT 1 FROM registry WHERE path = 'HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\SharedAccess\Parameters\FirewallPolicy\DomainProfile\EnableFirewall' AND data = '1';
  critical: false
  description: With the Domain profile firewall off, Windows filters no traffic while connected to a domain network.
  resolution: |
    Fleet enforces this with the "cis-firewall" configuration profile. Check that the profile shows as Verified on this host (Host details > OS settings). Group Policy equivalent: Windows Defender Firewall with Advanced Security > Domain Profile > Firewall state = On.
  platform: windows
  webhooks_and_tickets_enabled: false
- name: Windows - CIS - Domain firewall blocks inbound connections by default
  query: SELECT 1 FROM mdm_bridge WHERE mdm_command_input = '<SyncBody><Get><CmdID>1</CmdID><Item><Target><LocURI>./Device/Vendor/MSFT/Firewall/MdmStore/DomainProfile/DefaultInboundAction</LocURI></Target></Item></Get></SyncBody>' AND mdm_command_output = '1';
  critical: false
  description: Inbound connections that don't match an allow rule are blocked, so only explicitly permitted services are reachable.
  resolution: |
    Fleet enforces this with the "cis-firewall" configuration profile. Check that the profile shows as Verified on this host (Host details > OS settings). Group Policy equivalent: Windows Defender Firewall with Advanced Security > Domain Profile > Inbound connections = Block.
  platform: windows
  webhooks_and_tickets_enabled: false
- name: Windows - CIS - Domain firewall does not display notifications
  query: SELECT 1 FROM registry WHERE path = 'HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\SharedAccess\Parameters\FirewallPolicy\Mdm\DomainProfile\DisableNotifications' AND data = '1';
  critical: false
  description: Block notifications invite users to approve inbound exceptions they don't understand. CIS turns them off.
  resolution: |
    Fleet enforces this with the "cis-firewall" configuration profile. Check that the profile shows as Verified on this host (Host details > OS settings). Group Policy equivalent: Windows Defender Firewall with Advanced Security > Domain Profile > Settings > Display a notification = No.
  platform: windows
  webhooks_and_tickets_enabled: false
- name: Windows - CIS - Domain firewall log file is domainfw.log
  query: SELECT 1 FROM mdm_bridge WHERE mdm_command_input = '<SyncBody><Get><CmdID>1</CmdID><Item><Target><LocURI>./Device/Vendor/MSFT/Firewall/MdmStore/DomainProfile/LogFilePath</LocURI></Target></Item></Get></SyncBody>' AND mdm_command_output LIKE '%domainfw.log';
  critical: false
  description: A separate log file per profile makes firewall events easy to collect and attribute.
  resolution: |
    Fleet enforces this with the "cis-firewall" configuration profile. Check that the profile shows as Verified on this host (Host details > OS settings). Group Policy equivalent: Windows Defender Firewall with Advanced Security > Domain Profile > Logging > Name = %SystemRoot%\System32\logfiles\firewall\domainfw.log.
  platform: windows
  webhooks_and_tickets_enabled: false
- name: Windows - CIS - Domain firewall log size limit is 16,384 KB or greater
  query: SELECT 1 FROM mdm_bridge WHERE mdm_command_input = '<SyncBody><Get><CmdID>1</CmdID><Item><Target><LocURI>./Device/Vendor/MSFT/Firewall/MdmStore/DomainProfile/LogMaxFileSize</LocURI></Target></Item></Get></SyncBody>' AND CAST(mdm_command_output AS INTEGER) >= 16384;
  critical: false
  description: The default 1 MB log rolls over too fast to be useful in an investigation.
  resolution: |
    Fleet enforces this with the "cis-firewall" configuration profile. Check that the profile shows as Verified on this host (Host details > OS settings). Group Policy equivalent: Windows Defender Firewall with Advanced Security > Domain Profile > Logging > Size limit = 16,384 KB.
  platform: windows
  webhooks_and_tickets_enabled: false
- name: Windows - CIS - Domain firewall logs dropped packets
  query: SELECT 1 FROM mdm_bridge WHERE mdm_command_input = '<SyncBody><Get><CmdID>1</CmdID><Item><Target><LocURI>./Device/Vendor/MSFT/Firewall/MdmStore/DomainProfile/EnableLogDroppedPackets</LocURI></Target></Item></Get></SyncBody>' AND mdm_command_output = 'true';
  critical: false
  description: Dropped-packet logs show what was blocked and when, which is the first thing an investigation asks for.
  resolution: |
    Fleet enforces this with the "cis-firewall" configuration profile. Check that the profile shows as Verified on this host (Host details > OS settings). Group Policy equivalent: Windows Defender Firewall with Advanced Security > Domain Profile > Logging > Log dropped packets = Yes.
  platform: windows
  webhooks_and_tickets_enabled: false
