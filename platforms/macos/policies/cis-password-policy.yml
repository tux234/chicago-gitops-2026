# CIS Apple macOS 26 Tahoe Benchmark v1.1.0, section 5.2 Password Management (Level 2).
# Enforced by ../configuration-profiles/cis-password-policy.mobileconfig.
# These read fleetd tables (pwd_policy, password_policy), so hosts need Fleet's agent (fleetd), not plain osquery.
# 5.2.1, 5.2.2, 5.2.7, 5.2.8 queries from Fleet's CIS library: https://github.com/fleetdm/fleet/blob/main/ee/cis/macos-26/cis-policy-queries.yml
# 5.2.3 to 5.2.6 are Manual in CIS and not in Fleet's library; these queries follow the mSCP cis_lvl2 audit checks.
- name: macOS - CIS 5.2.1 - Account lockout threshold is 5 or fewer
  query: SELECT 1 FROM pwd_policy WHERE max_failed_attempts > 0 AND max_failed_attempts <= 5;
  critical: false
  description: Locking an account after a small number of failed sign-ins blunts brute-force password guessing.
  resolution: |
    Fleet enforces this with the "CIS - Password policy" configuration profile (maxFailedAttempts = 5). Check that the profile shows as Verified on this host (Host details > OS settings).
  platform: darwin
  webhooks_and_tickets_enabled: false
- name: macOS - CIS 5.2.2 - Minimum password length is 15 or more
  query: |
    SELECT 1 FROM (
      SELECT CAST(JSON_EXTRACT(policy_parameters, '$.minimumLength') AS INTEGER) AS minlength
      FROM password_policy
      WHERE policy_identifier LIKE '%minChars'
      AND minlength >= 15
    );
  critical: false
  description: Longer passwords are the single biggest factor in resisting guessing and cracking. CIS requires at least 15 characters.
  resolution: |
    Fleet enforces this with the "CIS - Password policy" configuration profile (minLength = 15). The new rule applies the next time the user changes their password.
  platform: darwin
  webhooks_and_tickets_enabled: false
- name: macOS - CIS 5.2.3 and 5.2.4 - Password must contain a letter and a number
  query: SELECT 1 FROM password_policy WHERE policy_identifier LIKE '%requireAlphanumeric%';
  critical: false
  description: Requiring both alphabetic and numeric characters widens the character set an attacker has to search. On macOS one key (requireAlphanumeric) enforces both CIS 5.2.3 and 5.2.4.
  resolution: |
    Fleet enforces this with the "CIS - Password policy" configuration profile (requireAlphanumeric = true). Check that the profile shows as Verified on this host (Host details > OS settings).
  platform: darwin
  webhooks_and_tickets_enabled: false
- name: macOS - CIS 5.2.5 - Password must contain a special character
  query: SELECT 1 FROM password_policy WHERE policy_content LIKE '%policyAttributePassword matches ''(.*[^a-zA-Z0-9].*){%';
  critical: false
  description: Requiring at least one non-alphanumeric character widens the character set an attacker has to search.
  resolution: |
    Fleet enforces this with the "CIS - Password policy" configuration profile (minComplexChars = 1). Check that the profile shows as Verified on this host (Host details > OS settings).
  platform: darwin
  webhooks_and_tickets_enabled: false
- name: macOS - CIS 5.2.6 - Password must contain uppercase and lowercase letters
  query: SELECT 1 FROM password_policy WHERE policy_content LIKE '%(?=.*[A-Z])%' AND policy_content LIKE '%(?=.*[a-z])%';
  critical: false
  description: Requiring mixed case widens the character set an attacker has to search. macOS has no dedicated key for this, so it is enforced with a custom password regex.
  resolution: |
    Fleet enforces this with the "CIS - Password policy" configuration profile (customRegex ^(?=.*[A-Z])(?=.*[a-z]).*$). Check that the profile shows as Verified on this host (Host details > OS settings).
  platform: darwin
  webhooks_and_tickets_enabled: false
- name: macOS - CIS 5.2.7 - Password expires within 365 days
  query: |
    SELECT 1 WHERE
      EXISTS (SELECT 1 FROM pwd_policy WHERE expires_every_n_days > 0 AND expires_every_n_days <= 365)
      OR EXISTS (SELECT 1 FROM pwd_policy WHERE days_to_expiration > 0 AND days_to_expiration <= 365);
  critical: false
  description: Expiring passwords limits how long a stolen or leaked password stays useful. CIS sets 365 days as the maximum.
  resolution: |
    Fleet enforces this with the "CIS - Password policy" configuration profile (maxPINAgeInDays = 365). Check that the profile shows as Verified on this host (Host details > OS settings).
  platform: darwin
  webhooks_and_tickets_enabled: false
- name: macOS - CIS 5.2.8 - Password history is 24 or more
  query: SELECT 1 FROM pwd_policy WHERE history_depth >= 24;
  critical: false
  description: Remembering previous passwords stops users from cycling back to an old, possibly compromised password.
  resolution: |
    Fleet enforces this with the "CIS - Password policy" configuration profile (pinHistory = 24). Check that the profile shows as Verified on this host (Host details > OS settings).
  platform: darwin
  webhooks_and_tickets_enabled: false
